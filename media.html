<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON in the Media — ICON Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#DC2626; --red-bright:#EF4444; --red-deep:#991B1B;
    --blue:#1D4ED8; --blue-bright:#3B82F6; --blue-deep:#1E3A8A;
    --bg:#FFFFFF; --bg-2:#F1F5F9;
    --glass:rgba(0,0,0,.04); --glass-border:rgba(0,0,0,.1);
    --text:#0F172A; --text-dim:#334155; --text-mute:#64748B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  ul{list-style:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px;}
  h1,h2,h3,h4{font-family:'Unbounded',sans-serif;line-height:1.2;}

  /* ── Header ── */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--glass-border);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .logo{display:flex;align-items:center;}
  .logo-img{height:48px;width:auto;object-fit:contain;display:block;}
  .back-btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:10px 20px;border-radius:100px;
    background:var(--glass);border:1px solid var(--glass-border);
    font-size:13px;font-weight:600;color:var(--text);
    transition:background .15s;
  }
  .back-btn:hover{background:rgba(0,0,0,.07);}
  .back-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

  /* ── Hero banner ── */
  .page-hero{
    background:linear-gradient(135deg,var(--blue-deep),var(--blue));
    padding:64px 0 60px;
    position:relative;overflow:hidden;
  }
  .page-hero::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 80% 50%,rgba(239,68,68,.18),transparent 60%);
    pointer-events:none;
  }
  .page-hero .eyebrow{color:rgba(255,255,255,.7);margin-bottom:12px;}
  .page-hero .eyebrow::before{content:"◆";font-size:9px;margin-right:8px;}
  .page-hero h1{font-size:clamp(28px,4vw,46px);color:#fff;margin-bottom:14px;}
  .page-hero p{font-size:15px;color:rgba(255,255,255,.75);max-width:52ch;}

  /* ── Filters ── */
  .filters{
    display:flex;flex-wrap:wrap;gap:10px;
    padding:32px 0 10px;
  }
  .filter-btn{
    padding:8px 18px;border-radius:100px;border:1.5px solid var(--glass-border);
    background:#fff;font-size:13px;font-weight:600;cursor:pointer;
    color:var(--text-dim);transition:all .15s;font-family:'Inter',sans-serif;
  }
  .filter-btn:hover,.filter-btn.active{
    background:var(--blue);border-color:var(--blue);color:#fff;
  }
  .filter-btn.active-red{background:var(--red);border-color:var(--red);color:#fff;}

  /* ── Media grid ── */
  .media-section{padding:40px 0 80px;}
  .grid-label{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-mute);
    margin-bottom:22px;padding-bottom:10px;
    border-bottom:1px solid var(--glass-border);
  }
  .media-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:48px;
  }

  .media-card{
    border-radius:20px;overflow:hidden;
    border:1px solid var(--glass-border);background:#fff;
    transition:transform .22s ease,box-shadow .22s ease;
    display:flex;flex-direction:column;
  }
  .media-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.09);}

  .media-thumb{
    position:relative;aspect-ratio:16/9;
    background-size:cover;background-position:center;overflow:hidden;flex-shrink:0;
  }
  .media-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .media-thumb iframe{width:100%;height:100%;border:0;display:block;}

  .media-type-badge{
    position:absolute;top:12px;left:12px;
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:100px;
    font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:#fff;
  }
  .badge-video{background:var(--red);}
  .badge-article{background:var(--blue);}
  .badge-feature{background:#7C3AED;}
  .media-type-badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

  .play-overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.28);opacity:0;transition:opacity .2s;
  }
  .media-card:hover .play-overlay{opacity:1;}
  .play-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;}
  .play-btn svg{width:20px;height:20px;fill:var(--red);margin-left:2px;}

  .media-body{padding:16px 18px 20px;display:flex;flex-direction:column;flex:1;}
  .media-source{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:7px;}
  .media-source.src-red{color:var(--red-bright);}
  .media-card h4{font-size:15px;line-height:1.4;color:var(--text);margin-bottom:6px;}
  .media-card p{font-size:12.5px;color:var(--text-mute);line-height:1.6;flex:1;margin-bottom:14px;}
  .media-card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--glass-border);padding-top:12px;}
  .media-date{font-size:11px;color:var(--text-mute);font-family:'Space Mono',monospace;}
  .media-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--blue);transition:gap .15s;}
  .media-link svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;}
  .media-card:hover .media-link svg{transform:translateX(3px);}

  /* ── Footer ── */
  footer{background:var(--bg-2);border-top:1px solid var(--glass-border);padding:36px 0;}
  .footer-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--text-mute);}
  .footer-bottom a:hover{color:var(--blue-bright);}

  @media(max-width:900px){.media-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.media-grid{grid-template-columns:1fr;} .filters{gap:8px;}}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="wrap nav">
    <div class="logo">
      <img src="logo.png" alt="ICON Institute" class="logo-img">
    </div>
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>
  </div>
</header>

<!-- Page hero -->
<div class="page-hero">
  <div class="wrap">
    <div class="eyebrow">Press &amp; Coverage</div>
    <h1>ICON in the Media</h1>
    <p>News articles, TV features, and video coverage from leading education media across India.</p>
  </div>
</div>

<!-- Media content -->
<div class="media-section">
  <div class="wrap">

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="filterMedia('all',this)">All</button>
      <button class="filter-btn" onclick="filterMedia('video',this)">Videos</button>
      <button class="filter-btn" onclick="filterMedia('article',this)">Articles</button>
      <button class="filter-btn" onclick="filterMedia('feature',this)">Features</button>
    </div>

    <!-- Grid -->
    <div id="mediaGrid" class="media-grid" style="margin-top:28px;"></div>

  </div>
</div>

<!-- Footer -->
<footer>
  <div class="wrap footer-bottom">
    <div>© 2026 ICON Institute. All rights reserved.</div>
    <div><a href="index.html#footer">Contact</a> · <a href="#">Privacy Policy</a></div>
  </div>
</footer>

<script>
const allMedia = [
  {
    type:'video', source:'Education Today', srcRed:false,
    title:'How ICON Institute Is Redefining JEE Coaching in Rajasthan',
    desc:'A full feature on ICON\'s small-batch model and its record-breaking 2025 JEE results.',
    date:'Mar 2025',
    thumb:'https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=640&h=360&fit=crop',
    video:'https://www.youtube-nocookie.com/embed/M7lc1UVf-VE',
    href:'#'
  },
  {
    type:'article', source:'City Express', srcRed:false,
    title:'1,200 Selections in a Single Year — The ICON Story',
    desc:'City Express covers ICON\'s milestone year and the methodology behind every result.',
    date:'Jun 2025',
    thumb:'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=640&h=360&fit=crop',
    href:'#'
  },
  {
    type:'article', source:'Career Compass', srcRed:false,
    title:'Scholarship Tests That Actually Change Lives',
    desc:'Career Compass spotlights ICON\'s 90% fee-waiver programme and its impact on first-gen learners.',
    date:'Jan 2025',
    thumb:'https://images.unsplash.com/photo-1606761568499-6d2451b23c66?w=640&h=360&fit=crop',
    href:'#'
  },
  {
    type:'video', source:'EdIndia Weekly', srcRed:true,
    title:'Inside a Model Classroom: ICON\'s Teaching Philosophy',
    desc:'EdIndia Weekly goes behind the scenes to show what makes ICON\'s doubt-clearing desk unique.',
    date:'Nov 2024',
    thumb:'https://images.unsplash.com/photo-1571260899304-425eee4c7efc?w=640&h=360&fit=crop',
    video:'https://www.youtube-nocookie.com/embed/M7lc1UVf-VE',
    href:'#'
  },
  {
    type:'feature', source:'The Campus Wire', srcRed:false,
    title:'NEET Success Rates: How ICON Tops the Charts Consistently',
    desc:'An in-depth feature on ICON\'s NEET programme, faculty credentials, and student outcomes.',
    date:'Aug 2024',
    thumb:'https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=640&h=360&fit=crop',
    href:'#'
  },
  {
    type:'article', source:'Rajasthan Bulletin', srcRed:true,
    title:'Bhilwara\'s ICON Institute Puts the City on the Education Map',
    desc:'Local coverage on how ICON became a nationally recognised coaching brand from a Tier-2 city.',
    date:'Apr 2025',
    thumb:'https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=640&h=360&fit=crop',
    href:'#'
  },
  {
    type:'video', source:'Career Compass TV', srcRed:false,
    title:'Hybrid Classrooms: The Future of Indian Coaching',
    desc:'A panel discussion featuring ICON\'s director on the rise of hybrid learning post-pandemic.',
    date:'Feb 2025',
    thumb:'https://images.unsplash.com/photo-1509062522246-3755977927d7?w=640&h=360&fit=crop',
    video:'https://www.youtube-nocookie.com/embed/M7lc1UVf-VE',
    href:'#'
  },
  {
    type:'feature', source:'EdIndia Weekly', srcRed:true,
    title:'Top 10 Coaching Institutes in Rajasthan 2025',
    desc:'ICON ranked #2 in Rajasthan in EdIndia\'s annual survey of 300+ coaching centres.',
    date:'Dec 2024',
    thumb:'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=640&h=360&fit=crop',
    href:'#'
  },
  {
    type:'article', source:'Education Today', srcRed:false,
    title:'Small Batches, Big Results: The ICON Experiment',
    desc:'Education Today analyses the data behind capping batches at 30 and what it means for learning outcomes.',
    date:'Sep 2024',
    thumb:'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=640&h=360&fit=crop',
    href:'#'
  },
];

let activeFilter = 'all';

function badgeIcon(type){
  if(type==='video') return `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
  return `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
}

function renderGrid(filter){
  const items = filter==='all' ? allMedia : allMedia.filter(m=>m.type===filter);
  const grid = document.getElementById('mediaGrid');
  if(!items.length){
    grid.innerHTML = '<p style="color:var(--text-mute);padding:40px 0;">No items found.</p>';
    return;
  }
  grid.innerHTML = items.map(m => {
    const thumbHtml = m.video
      ? `<iframe src="${m.video}" title="${m.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
      : `<img src="${m.thumb}" alt="${m.title}" loading="lazy">
         <div class="play-overlay" style="${m.type!=='video'?'display:none':''}">
           <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
         </div>`;
    const badgeClass = m.type==='video'?'badge-video':m.type==='feature'?'badge-feature':'badge-article';
    const label = m.type.charAt(0).toUpperCase()+m.type.slice(1);
    const linkText = m.type==='video'?'Watch':'Read';
    return `
      <div class="media-card">
        <div class="media-thumb">${thumbHtml}
          <span class="media-type-badge ${badgeClass}">${badgeIcon(m.type)} ${label}</span>
        </div>
        <div class="media-body">
          <div class="media-source${m.srcRed?' src-red':''}">${m.source}</div>
          <h4>${m.title}</h4>
          <p>${m.desc}</p>
          <div class="media-card-footer">
            <span class="media-date">${m.date}</span>
            <a href="${m.href}" class="media-link">${linkText}
              <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
        </div>
      </div>`;
  }).join('');
}

function filterMedia(type, btn){
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(type);
}

renderGrid('all');
</script>
</body>
</html>
